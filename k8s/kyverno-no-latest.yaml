apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: prohibit-latest-image-tag
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: reject-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Container images must be referenced by tag or digest, never by :latest."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
